name: Release Library

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP archive for Arduino IDE
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          # Package library root folder without git metadata
          zip -r "dist/ZynqIoT-${VERSION}.zip" . -x "*.git*" "dist/*" ".github/*"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
